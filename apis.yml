name: Nara Organics
description: >-
  Nara Organics is a direct-to-consumer organic infant-formula brand, surfaced as a
  portfolio company of Initialized Capital and profiled in the API Evangelist network.
  It is not a traditional API provider, but its Shopify storefront at nara.com exposes a
  modern agent-native commerce surface: a published Universal Commerce Protocol (UCP) MCP
  endpoint for agent-driven catalog search, cart, and buyer-approved checkout; a Shopify
  Customer Account OIDC provider; and /llms.txt + /agents.md agent instructions covering the
  read-only product surface and the Shop Pay flow. The company is currently managing a
  voluntary infant-formula recall communicated through its storefront.
